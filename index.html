<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryan | Developer & Educator</title>
  </head>
  <body class="bg-slate-950 text-slate-50 min-h-screen">
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; white-space: pre-wrap; z-index: 9999; position: absolute; top:0;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('error-log').innerText += message + '\n' + (error && error.stack ? error.stack : '') + '\n\n';
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
