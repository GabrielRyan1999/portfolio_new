<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="tools-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1118"/>
      <stop offset="100%" stop-color="#121F2D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#tools-bg)"/>

  <!-- Window Header -->
  <rect width="1200" height="44" fill="#080D14"/>
  <circle cx="28" cy="22" r="6" fill="#EF4444"/>
  <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="22" r="6" fill="#10B981"/>
  <rect x="360" y="10" width="480" height="24" rx="4" fill="#13202E"/>
  <text x="600" y="26" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">ryan-s-tools.vercel.app // local-first-pwa</text>

  <!-- PWA Offline Badge -->
  <rect x="1040" y="12" width="130" height="20" rx="3" fill="#10B981" opacity="0.2"/>
  <text x="1105" y="26" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">● LOCAL WASM ENGINE</text>

  <!-- Top Nav Bar -->
  <g transform="translate(60, 70)">
    <text x="0" y="28" fill="#F8FAFC" font-family="sans-serif" font-weight="900" font-size="24" letter-spacing="1">RYAN'S TOOLKIT</text>
    <text x="0" y="50" fill="#64748B" font-family="monospace" font-size="11">LOCAL-FIRST PRIVACY UTILITIES // 0 SERVER UPLOADS // WASM + TESSERACT</text>
  </g>

  <!-- Tools Grid -->
  <g transform="translate(60, 150)">
    <!-- Tool 1: PDF Studio (Active) -->
    <rect width="340" height="280" rx="8" fill="#132233" stroke="#2563EB" stroke-width="2"/>
    <rect x="20" y="20" width="40" height="40" rx="6" fill="#2563EB" opacity="0.2"/>
    <text x="40" y="45" fill="#60A5FA" font-family="monospace" font-size="18" text-anchor="middle">PDF</text>
    <text x="75" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">PDF-Lib Workspace</text>
    <text x="75" y="54" fill="#10B981" font-family="monospace" font-size="10">OFFLINE PRIVACY READY</text>
    <text x="20" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12" line-height="1.5">
      Merge, reorder, split, compress, and redact PDF documents locally in the browser with zero data leaving the device.
    </text>

    <!-- Interactive Dropzone Mock -->
    <rect x="20" y="140" width="300" height="110" rx="6" fill="#0C1724" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4"/>
    <text x="170" y="190" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="middle">Drag &amp; Drop PDF Document Here</text>
    <text x="170" y="210" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">WASM BUFFER: READY</text>

    <!-- Tool 2: AI Background Remover -->
    <rect x="370" width="340" height="280" rx="8" fill="#132233" stroke="#1E3A5F" stroke-width="1"/>
    <rect x="390" y="20" width="40" height="40" rx="6" fill="#8B5CF6" opacity="0.2"/>
    <text x="410" y="45" fill="#A78BFA" font-family="monospace" font-size="18" text-anchor="middle">AI</text>
    <text x="445" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Background Remover</text>
    <text x="445" y="54" fill="#8B5CF6" font-family="monospace" font-size="10">ON-DEVICE TENSORFLOW</text>
    <text x="390" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12">
      Instantly isolate portraits, products, and graphic assets using in-browser neural segmentation without cloud APIs.
    </text>
    <rect x="390" y="140" width="300" height="110" rx="6" fill="#0C1724" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="540" cy="185" r="28" fill="#1E3A5F"/>
    <text x="540" y="190" fill="#A78BFA" font-family="monospace" font-size="10" text-anchor="middle">MODEL LOADED</text>
    <text x="540" y="230" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">100% CLIENT COMPUTE</text>

    <!-- Tool 3: Tesseract OCR Scanner -->
    <rect x="740" width="340" height="280" rx="8" fill="#132233" stroke="#1E3A5F" stroke-width="1"/>
    <rect x="760" y="20" width="40" height="40" rx="6" fill="#F59E0B" opacity="0.2"/>
    <text x="780" y="45" fill="#FBBF24" font-family="monospace" font-size="18" text-anchor="middle">OCR</text>
    <text x="815" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Tesseract OCR Reader</text>
    <text x="815" y="54" fill="#F59E0B" font-family="monospace" font-size="10">MULTI-LANGUAGE WASM</text>
    <text x="760" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12">
      Extract machine-readable text and tables from invoices, receipts, and handwritten documents straight into clipboard.
    </text>
    <rect x="760" y="140" width="300" height="110" rx="6" fill="#0C1724" stroke="#1E3A5F" stroke-width="1"/>
    <text x="775" y="170" fill="#64748B" font-family="monospace" font-size="10">&gt; Parsing image buffer...</text>
    <text x="775" y="195" fill="#F8FAFC" font-family="monospace" font-size="11">"Total Tuition: IDR 4,500,000"</text>
    <text x="775" y="220" fill="#10B981" font-family="monospace" font-size="10">CONFIDENCE: 99.2%</text>
  </g>

  <!-- Performance Benchmark Terminal Bar -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="260" rx="8" fill="#0B1420" stroke="#1E293B" stroke-width="1"/>
    <rect width="1080" height="36" rx="8" fill="#101D2E"/>
    <text x="24" y="23" fill="#64748B" font-family="monospace" font-size="11">TERMINAL BENCHMARK // WEBASSEMBLY V8 OPTIMIZATION</text>
    
    <text x="24" y="65" fill="#38BDF8" font-family="monospace" font-size="12">&gt; navigator.serviceWorker.register('/sw.js') [STATUS: ACTIVE_CACHE]</text>
    <text x="24" y="95" fill="#94A3B8" font-family="monospace" font-size="12">&gt; WASM Module `pdf-lib-engine.wasm` initialized in 14.2ms</text>
    <text x="24" y="125" fill="#94A3B8" font-family="monospace" font-size="12">&gt; Tesseract worker loaded (en + id dictionaries) // Thread pool: 4 workers</text>
    <text x="24" y="155" fill="#10B981" font-family="monospace" font-size="12">&gt; Zero network telemetry transmitted. Client data remains 100% on device.</text>
    <line x1="24" y1="180" x2="1056" y2="180" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="210" fill="#F8FAFC" font-family="monospace" font-size="12">PWA COMPLIANCE: 100/100 LIGHTHOUSE // INSTALLABLE AS DESKTOP &amp; MOBILE APP</text>
  </g>
</svg>
