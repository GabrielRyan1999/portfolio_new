    <text x="280" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">Python Pygame Architecture</text>
    <rect x="480" y="141" width="120" height="8" rx="4" fill="#1E293B"/>
    <rect x="480" y="141" width="90" height="8" rx="4" fill="#3B82F6"/>
    <text x="610" y="150" fill="#94A3B8" font-family="monospace" font-size="10">75%</text>
    <text x="680" y="150" fill="#3B82F6" font-family="monospace" font-size="11">IN PROGRESS</text>
    <text x="800" y="150" fill="#38BDF8" font-family="monospace" font-size="11">VIEW LOG</text>

    <!-- Row 3 -->
