    <rect x="480" y="186" width="120" height="8" rx="4" fill="#10B981"/>
    <text x="610" y="195" fill="#94A3B8" font-family="monospace" font-size="10">100%</text>
    <text x="680" y="195" fill="#10B981" font-family="monospace" font-size="11">SUBMITTED</text>
    <text x="800" y="195" fill="#38BDF8" font-family="monospace" font-size="11">VIEW LOG</text>
