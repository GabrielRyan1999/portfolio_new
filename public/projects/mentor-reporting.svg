  <text x="36" y="245" fill="#94A3B8" font-family="sans-serif" font-size="12">Attendance Logs</text>
  <text x="36" y="285" fill="#94A3B8" font-family="sans-serif" font-size="12">Curriculum Progress</text>
  <text x="36" y="325" fill="#94A3B8" font-family="sans-serif" font-size="12">Parent Reports</text>
  <text x="36" y="365" fill="#94A3B8" font-family="sans-serif" font-size="12">Metaverse Analytics</text>

  <!-- Main Content Area -->
  <!-- Top Stats Bar -->
