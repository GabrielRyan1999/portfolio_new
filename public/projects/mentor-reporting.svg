    <text x="840" y="90" fill="#10B981" font-family="monospace" font-size="9">DONE</text>

    <rect x="610" y="134" width="270" height="54" rx="4" fill="#162A45"/>
    <text x="622" y="154" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">Dharma Mulya School</text>
    <text x="622" y="172" fill="#94A3B8" font-family="monospace" font-size="9">PYTHON GAME DEV // INTERMEDIATE</text>
    <text x="840" y="154" fill="#10B981" font-family="monospace" font-size="9">DONE</text>

